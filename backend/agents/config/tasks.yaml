# [CrewAI] 태스크 선언 (Description, Expected Output, HITL 가드레일)
# 순차 Crew: Crew A(benchmark→gap), [HITL+소싱], Crew B(roadmap→dashboard)
# JD structuralize_jd 는 희망 직무 캐시 저장 시에만 단독 실행.

# ===== Task 1: Diagnosis_Spec_Gap =====
diagnosis_spec_gap:
  description: >
    1. 사용자의 복합 스펙 데이터(JSON)를 입력 컨텍스트로 확보한다.

    [사용자 스펙]
    {user_spec}

    [희망 직무 JD 컨텍스트]
    {jd_context}

    [워크넷 직업선호도검사(L형) 결과]
    {psychological_test}

    2. 앞서 도출된 '합격자 평균 벤치마킹 스펙(목표치)'과 사용자의 스펙을 1:1로 정밀 매칭하라.
       벤치마크의 common_certificates·average_language_scores·common_activities_and_careers를
       각각 자격증·어학·경험 Gap 항목으로 구체화하라. 추상적 역량명만 나열하지 마라.

    [합격자 벤치마킹 스펙 (목표)]
    {benchmark_output}

    [1차 유저 추가 피드백]
    {user_feedback_1}

    3. 사용자 이력에서 '담당자 마인드셋(Operator)'이 결여된 부분, '경험의 일관성 공식(4회 연속 빌드업)'이
       깨진 공백 영역을 추적하여 'Gap' 자산으로 정의하라.
    4. 발견된 모든 공백은 '진정성(Authenticity)'군과 '전문성(Professionalism)'군으로 명확히 분류하고,
       부족도 점수(1~100점) 및 정성적 분석 코멘트와 보완용 검색 키워드를 작성하라.
    5. 어학(TOEIC/OPIc 등) 또는 자격증(정보처리기사/SQLD 등) 관련 Gap은 keyword에 해당 종류명을
       명시하고 required_criteria에 구체 자격/점수 기준을 적어라.
  expected_output: >
    마크다운 기호 없이 순수 JSON 객체 하나만 출력하라.
    스키마: {"total_gap_percentage": 0-100 실수,
    "authenticity_score": 0-100 정수, "professionalism_score": 0-100 정수,
    "gap_analysis_report": [{"category": "진정성(Authenticity)|전문성(Professionalism)",
    "required_criteria": "요구 기준 역량", "current_status": "현재 상태/부족 사유",
    "gap_description": "상세 정성 피드백", "severity_score": 1-100, "keyword": "보완 검색 키워드"}],
    "feedback": "인사팀장 관점 총평 문자열"}
  agent: gap_analyzer
  human_input: true  # [HITL 2차] 진단 Gap 리포트 컨펌 및 누락 경험 피드백 수용 위해 대기

# ===== Task 3: Synthesize_Action_Roadmap =====
synthesize_action_roadmap:
  description: >
    0. [현재 시점 — 최우선 제약]
    현재 날짜는 {current_date} ({current_year}년)이다.

    1. 확정된 'Gap 분석 결과', 2차 유저 피드백 및 사용자 보유 자격증을 수집한다.
    [확정 Gap 리포트]
    {confirmed_gap}
    [합격자 벤치마킹 스펙 — 4단계 조사 결과, Phase 2~4 actions·자격증·어학에 반드시 반영]
    {benchmark_output}
    [2차 유저 추가 피드백]
    {user_feedback_2}
    [사용자 보유 자격증]
    {user_certificates}
    [사용자 전체 스펙]
    {user_spec_full}

    2. 아래 [실시간 소싱 데이터]는 외부 API 도구를 가동해 수집한 실시간 공모전/자격증/대외활동/채용공고 데이터이다.
    [실시간 소싱 데이터]
    {sources_text}

    3. 당신은 임의의 모든 직무군에 대해 4단계 서사적 시계열 로드맵을 설계하는 시스템 알고리즘 엔진입니다.
    출력되는 각 Phase는 [진정성]과 [전문성]이 결합되어야 하며, 다음 '콘텐츠 타입 하드 레규레이션'을 칼같이 준수하여 텍스트 가이드와 링크를 생성하세요.

    [Phase별 필수 인젝션 규칙 (진정성-전문성 1:1 결합)]
    - Phase 1: 유저 Input 경험 중 직무 Start point 매핑. 어학 점수, 추천 봉사를 `action_groups`에 명시하라. [실시간 소싱 데이터] 중 '봉사활동' 관련 링크는 반드시 Phase 1의 `sources` 배열에만 넣고 다른 Phase에는 절대 넣지 마라. (★ 채용/인턴/공모전 절대 포함 금지)
    - Phase 2: 자격증, 대외활동 중 '학습(Study/Learning)'에 관한 내용을 중점적으로 매핑하라. [실시간 소싱 데이터] 중 '학습/자격증' 관련 링크는 Phase 2의 `sources` 배열에 넣을 수 있다. (★ 신입사원/인턴십 공고 절대 포함 금지)
    - Phase 3: 프로젝트 위주의 '직무 공모전', '프로젝트형 대외활동', 그리고 [실시간 소싱 데이터]의 '부트캠프/훈련과정(고용24)' 링크를 매핑하라. 공모전/프로젝트 링크와 부트캠프/훈련 링크는 반드시 Phase 3의 `sources` 배열에만 넣으라. (★ 봉사활동, 인턴십, 채용 공고 절대 넣지 말 것!)
    - Phase 4: 최종 커리어 확장을 위한 '실시간 인턴십(Internship) 공고'와 '신입 채용 공고'를 이곳에 집중적으로 매핑하라. [실시간 소싱 데이터] 중 '인턴십/채용공고' 링크는 반드시 Phase 4의 `sources` 배열에만 넣으라. (★ 봉사활동, 단순 대외활동 절대 넣지 말 것!)

    [출력 포맷 및 날짜 하드 룰]
    1. 모든 외부 추천 링크의 헤더에는 현재 날짜({current_date}) 기준으로 계산된 잔여 일수 태그(`[D-남은일수]` 또는 `[상시모집]`)가 반드시 결합되어야 합니다.
    2. [사용자 전체 스펙]의 데이터 중 `end_date`나 `acquisition_date`가 현재 시점(`{current_date}`)보다 과거인 경우, 미래의 로드맵(Phase 1~4) 행동 지침(Action)으로 절대 다시 추천하지 마라! 과거에 취득/종료된 스펙은 모두 '완료(Achieved)'된 것으로 취급하여 Phase 추천에서 배제해야 한다.
    3. 마감일이 `{current_date}`보다 과거인 추천 만료 데이터도 연산 과정에서 100% Drop(배제)하세요.
    4. Phase 1~4 모든 단계의 `sources` 배열에 추천 링크를 위 규칙에 맞게 정확히 분배하여 넣을 것. Phase 4에서 특정 기업 공고가 없을 시 동일 직무 카테고리의 모든 인턴십 링크를 대안으로 매핑하세요.
    5. 각 Phase의 `actions` 배열(또는 `action_groups`)에는 최소 5~8개의 매우 구체적이고 실전적인 행동 지침(Action Items)을 작성하라. 단, 해당 Phase 규칙에 맞지 않는 행동 지침은 절대 넣지 마라. ★만약 유저가 이미 해당 Phase의 요구 기준을 충족하여 추가 행동 지침이 불필요하다면, 배열을 비워두지 말고 유저가 이미 달성한 기존 스펙을 기입한 뒤 끝에 '(충족)'이라고 명시하라. (예: "정보처리기사 취득 (충족)")
    6. timeline 배열은 phase_num 1, 2, 3, 4를 각각 정확히 1개씩 포함해야 한다. 3개 이하 또는 5개 이상 출력 금지.
    7. [사용자 보유 자격증]과 [확정 Gap]을 대조하여, 합격에 필요한 자격증을 `required_certifications` 배열에 명시하라. 보유한 자격증은 status="보유"로 표기하고, **절대 추가 행동 지침(actions)으로 반복 추천하지 마라**. 미보유만 "취득 필요"로 표기하라.
    8. [사용자 스펙]과 [확정 Gap]을 대조하여, 목표 기업 합격에 필요한 어학 컷오프(예: TOEIC 800, OPIc IM2 등)를 `required_language_scores` 배열에 명시하고, 사용자의 현재 점수와 달성 여부를 평가하라.
  expected_output: >
    백엔드가 즉시 파싱하도록 마크다운 기호(`json)를 절대 섞지 말고 순수 JSON 객체 하나만 출력하라.
    스키마: {"success": true, "total_gap_percentage": 0-100 실수,
    "gap_analysis_report": [{"category": "...", "required_criteria": "...", "current_status": "...",
    "gap_description": "...", "severity_score": 1-100}],
    "required_certifications": [
      {"name": "정보처리기사", "issuer": "한국산업인력공단", "priority": "필수|권장|우대",
       "target_phase": 3, "reason": "합격 스펙·Gap 근거", "status": "취득 필요|보유"}
    ],
    "required_language_scores": [
      {"language_type": "TOEIC", "target_score": "800", "current_score": "없음", "status": "달성|미달"}
    ],
    "timeline": [
      {"phase_num": 1, "phase_title": "기초 역량 확립 및 스펙 방향성 수립 (Foundational Competency & Spec Alignment)", "period": "1~2개월",
       "narrative_bridge_directive": "직무 기초 지식 및 스펙 방향성 수립 지침",
       "actions": [],
       "action_groups": [
         {"category": "경험 기반 Start Point", "items": ["유저 경험 연계 문장 또는 필요한 경험 제시"]},
         {"category": "어학 및 봉사", "items": ["필요 어학 점수", "추천 봉사활동"]},
         {"category": "직무 기초 지식", "items": ["기초 서적 또는 온라인 강의 수강"]}
       ],
       "sources": [{"source_platform": "출처(링커리어 등)", "title": "활동명", "link_url": "URL", "keyword_match": "어학/기초툴 매핑"}],
       "required_certifications": [], "expected_outcome": "획득 실무 역량"},
      {"phase_num": 2, "phase_title": "직무 전문성 강화 프로젝트 수행 (Core Skill & Project Buildup)", "period": "2~3개월",
       "narrative_bridge_directive": "자격증 취득 및 부트캠프 참여 지침",
       "actions": ["구체적 행동 지침 1", "구체적 행동 지침 2"],
       "action_groups": [],
       "sources": [{"source_platform": "출처", "title": "활동명", "link_url": "URL", "keyword_match": "자격증/K-Digital_Training 매핑"}],
       "required_certifications": [], "expected_outcome": "프로젝트 산출물 및 실증 역량"},
      {"phase_num": 3, "phase_title": "실시간 공모전/부트캠프 검증 (Live Contest, Bootcamp & Project Validation)", "period": "3~4개월",
       "narrative_bridge_directive": "실전 검증, 팀 협업, 분야·직무 맞춤 부트캠프/훈련 참여 지침",
       "actions": ["구체적 행동 지침 1", "구체적 행동 지침 2"],
       "action_groups": [],
       "sources": [{"source_platform": "출처(링커리어/고용24 등)", "title": "활동명", "link_url": "URL", "keyword_match": "공모전/부트캠프/훈련 매핑"}],
       "required_certifications": [], "expected_outcome": "실무 경험 및 네트워킹 기회 확보"},
      {"phase_num": 4, "phase_title": "포트폴리오 완성 및 취업 대비 (Portfolio & Employment Readiness)", "period": "5~6개월",
       "narrative_bridge_directive": "포트폴리오 고도화 및 구인 매칭 지침",
       "actions": ["구체적 행동 지침 1", "구체적 행동 지침 2"],
       "action_groups": [],
       "sources": [{"source_platform": "출처", "title": "신입/인턴십 채용 공고", "link_url": "URL", "keyword_match": "실무 검증 매핑"}],
       "required_certifications": [], "expected_outcome": "최종 취업 준비 완료 상태"}
    ]}
  agent: roadmap_harness
  human_input: false  # 최종 단계: 즉시 빌드하여 클라이언트로 반환

# ===== Task 4: Summarize_Dashboard =====
summarize_dashboard:
  description: >
    아래 [실제 조사 데이터]만 근거로 대시보드 요약을 작성하세요. gap_report에 없는 역량명을 창작하지 마세요.

    [타겟] {target_company} / {target_job} ({target_field}) · {user_name}

    [갭 진단 총평]
    {gap_feedback}

    [갭 항목 리포트 — gap_top2는 required_criteria를 그대로 2개 선택]
    {gap_report}

    [벤치마크 요약]
    {benchmark_summary}

    [합격자 벤치마크 상세]
    {benchmark_json}

    [로드맵 Phase 1 액션 — current_month_tasks 우선 참고]
    {phase1_actions}

    규칙:
    1) total_summary: gap_feedback·벤치마크를 종합한 인사팀장 총평 2문장 (일반론 금지)
    2) gap_top2: gap_report 상위 severity의 required_criteria 문자열을 변경 없이 2개
    3) current_month_tasks: phase1_actions 또는 gap_report keyword 기반 실행 과제 2~3개
    4) "데이터 분석", "프로젝트 관리" 등 gap_report에 없는 추상 역량명 사용 금지
  expected_output: >
    프론트엔드 대시보드 UI 및 PDF 리포트 1페이지에 하드코딩 없이 다이렉트로 매핑 가능한 구조화된 JSON 데이터만 출력하라. 스키마:
    {"total_summary": "인사팀장 총평 2줄", "severity_score": 85, "gap_top2": ["보완점1", "보완점2"], "current_month_tasks": ["태스크1", "태스크2"]}
  agent: dashboard_summarizer
  human_input: false


# ===== Task 0: Structuralize_JD =====
structuralize_jd:
  description: >
    1. 타겟 URL(`target_url`)이 주어지면 Playwright_Scraper_Tool로 원문을 수집하라.
       - 스크래핑 실패 또는 결과가 "스크래핑 실패"·"접근 불가"·"비어있습니다" 포함 시: 같은 URL로 재시도 금지.
         대신 아래 [채용 공고 원문]을 직접 사용하라.
       - URL이 없으면 즉시 [채용 공고 원문]을 사용하라.

    [채용 공고 URL]
    {target_url}

    [채용 공고 원문 (스크래핑 실패 시 또는 URL 없을 때 사용)]
    {raw_text}

    2. 주요 업무(Responsibilities), 자격 요건(Requirements), 우대 사항(Preferred) 영역을 정확히 식별 및 분리하라.
    3. 공고문 내에 명시된 핵심 프레임워크, 프로그래밍 언어, 개발 툴 등의 '기술 스택'을 키워드 단위로 추출하라.
    4. 추출된 데이터를 지정된 JSON 출력 스키마에 맞춰 매핑하라.
    5. 정보가 부족하더라도 반드시 Final Answer(JSON)를 출력하라. 툴 재시도 2회 초과 금지.
  expected_output: >
    마크다운 기호 없이 순수 JSON 객체 하나만 출력하라.
    스키마: {
      "company_name": "string (예: 카카오)",
      "job_title": "string (예: AI 데이터 라벨링 어시스턴트)",
      "primary_duties": ["string"],
      "mandatory_requirements": ["string (필수 요건 줄글 및 핵심 키워드)"],
      "preferred_qualifications": ["string (우대 사항 줄글 및 핵심 키워드)"],
      "required_tech_stacks": ["string (예: Python, LLM, QA 등 Tech Keyword)"]
    }
  agent: jd_structural_analyzer
  human_input: false

# ===== Task 5: Benchmark_Accepted_Specs =====
benchmark_accepted_specs:
  description: >
    1. 전달받은 Target 기업({target_company}), 분야({target_field}), 희망 직무({target_job})를 확인한다.
    [희망 직무 JD 컨텍스트]
    {jd_context}
